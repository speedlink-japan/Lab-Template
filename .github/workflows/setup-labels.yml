name: Setup Labels

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  setup-labels:
    runs-on: ubuntu-latest

    steps:
      - name: Create Labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: '機能', color: '0E8A16', description: '新規機能' },
              { name: '改善', color: '1D76DB', description: '改善対応' },
              { name: 'バグ', color: 'D73A4A', description: '不具合対応' },
              { name: 'ラベル/担当者/優先度が未設定', color: 'FBCA04', description: '入力不足' },
              { name: '最優先', color: 'B60205', description: '最優先で対応が必要' },
              { name: '高', color: 'D93F0B', description: '優先度高' },
              { name: '中', color: 'FBCA04', description: '優先度中' },
              { name: '低', color: '0E8A16', description: '優先度低' }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (e) {
                console.log(`${label.name} already exists or could not be created`);
                console.log(e.message);
              }
            }
